version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: clipflow/server:dev
    environment:
      - CLIPFLOW_SERVER_ADDR=:8080
      - CLIPFLOW_SERVER_DSN=file:/data/clipflow_server.db?_pragma=busy_timeout(5000)
    ports:
      - "8080:8080"
    volumes:
      - server-data:/data
    restart: unless-stopped

volumes:
  server-data:
    driver: local
